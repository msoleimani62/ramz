[workspace]
resolver = "2"
members = [
    "core",
    "backends-age",
    "backends-7z",
    "cli",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/msoleimani62/ramz"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
indicatif = "0.17"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
proptest = "1"
